[workspace]
members = [
    "crates/hook-kit",
    "crates/hook-template-sdk",
    "crates/hook-policy-model",
    "crates/transfer-hook-sdk",
    "crates/raydium-adapters",
    "crates/raydium-hook-driver",
    "crates/raydium-hook-cli",
    "integrations/cpmm",
    "integrations/clmm",
    "integrations/launchlab",
    "crates/reference-hook-model",
    "programs/reference-hook-onchain",
    "programs/arbitrary-test-hook",
    "programs/bench-hook",
    "programs/hook-template-registry",
    "templates/creator-commitment",
    "templates/anti-bundle",
    "templates/fair-launch",
    "templates/loyalty-rewards",
    "templates/parent-spin-off",
    "benches/harness",
    "tests/models",
    "tests/program-test",
    "tests/third-party-hook",
    "xtask",
]
exclude = ["templates/transfer-hook-starter"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"
