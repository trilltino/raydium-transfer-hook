[workspace]
members = [
    "hook-kit",
    "templates/creator-commitment",
    "templates/fair-launch",
    "templates/holder-rewards",
]
# The starter is standalone on purpose (you copy it out).
exclude = ["starter"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.88"

# Programs must not wrap silently: an overflow becomes a failed transaction, never a wrong value.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
