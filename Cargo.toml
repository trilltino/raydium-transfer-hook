[workspace]
members = [
    "crates/hook-kit",
    "crates/hook-policy-model",
    "crates/transfer-hook-sdk",
    "crates/raydium-hook-driver",
    "crates/raydium-hook-cli",
    "integrations/cpmm",
    "integrations/clmm",
    "integrations/launchlab",
    "crates/reference-hook-model",
    "programs/reference-hook-onchain",
    "programs/arbitrary-test-hook",
    "templates/creator-commitment",
    "tests/e2e",
    "xtask",
]
exclude = ["templates/transfer-hook-starter"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"
