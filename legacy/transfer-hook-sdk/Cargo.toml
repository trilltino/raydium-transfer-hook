[package]
name = "transfer-hook-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Exposes `testing` helpers (Token-2022 mint data, real ExtraAccountMetaList
# builders, an in-memory account fetcher) to downstream test code.
test-utils = []

[dependencies]
hook-policy-model = { path = "../hook-policy-model" }
solana-program = "=2.2.1"
spl-token = "=7.0.0"
spl-token-2022 = { version = "=7.0.0", features = ["no-entrypoint"] }
spl-tlv-account-resolution = "=0.10.0"
spl-transfer-hook-interface = "=0.10.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
