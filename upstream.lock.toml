# Machine-readable upstream source locks. See docs/upstream-sources.md.
#
# Raydium source is NOT vendored in this repository. `cargo xtask upstream fetch`
# clones these repositories into the git-ignored `target/upstream/` directory and
# checks out the exact revisions below; `cargo xtask upstream verify` checks them.
#
# `base_revision`  - the reviewed upstream commit (source-review lock).
# `hook_*`         - the external branch carrying the Transfer Hook support change on
#                    top of `base_revision`. Populated only from real, pushed commits;
#                    never fabricated. The hook change lives in that external repository,
#                    not in this one.
#
# These source-review revisions are independent of the Rust crate versions in this
# workspace (see [executable_line] in docs/upstream-sources.md).

[cpmm]
