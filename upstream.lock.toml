package = "raydium-cp-swap"
program_dir = "programs/cp-swap"
hook_repository = "https://github.com/trilltino/raydium-cp-swap"
hook_branch = "transfer-hook-support"
hook_revision = "75ddc09f102c8e3e4424058cee188bf8277949fc"

