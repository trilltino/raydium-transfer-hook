[package]
name = "hook-kit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Plumbing every Token-2022 Transfer Hook needs: Execute prelude, mint and token reads, PDA creation"

[features]
# In-process test helpers: a Token-2022 mint with a hook, funded accounts, and transfers whose
# hook accounts are resolved from the validation list.
test-support = ["dep:solana-program-test", "dep:solana-sdk"]

[dependencies]
solana-program = "=2.2.1"
spl-token-2022 = { version = "=7.0.0", features = ["no-entrypoint"] }
spl-transfer-hook-interface = "=0.10.0"
solana-program-test = { version = "=2.2.7", optional = true }
solana-sdk = { version = "=2.2.2", optional = true }

[dev-dependencies]
spl-pod = "=0.5.1"
spl-tlv-account-resolution = "=0.10.0"
