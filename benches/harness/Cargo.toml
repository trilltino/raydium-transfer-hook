[package]
name = "hook-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Measures what a Transfer Hook costs: accounts, transaction bytes and compute, for transfers and Raydium swaps"

[lib]
name = "hook_bench"
path = "src/lib.rs"

[[bin]]
name = "hook-bench"
path = "src/main.rs"

[dependencies]
bench-hook = { path = "../../programs/bench-hook", features = ["no-entrypoint"] }
hook-kit = { path = "../../crates/hook-kit", features = ["test-support"] }
program-test-flows = { path = "../../tests/program-test" }
raydium-hook-driver = { path = "../../crates/raydium-hook-driver", features = ["local"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-program-test = "=2.2.7"
solana-sdk = "=2.2.2"
spl-tlv-account-resolution = "=0.10.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
