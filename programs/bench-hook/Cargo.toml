[package]
name = "bench-hook"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "A measurement hook: the number of extra accounts it declares is a parameter, and it does no other work"

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Link as a library without exporting the program entrypoint symbol.
no-entrypoint = []

[dependencies]
hook-kit = { path = "../../crates/hook-kit" }
solana-program = "=2.2.1"
spl-tlv-account-resolution = "=0.10.0"
spl-token-2022 = { version = "=7.0.0", features = ["no-entrypoint"] }
