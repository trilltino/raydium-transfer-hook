[package]
name = "hook-template-registry"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Optional, permissionless metadata for Transfer Hook templates. Publishing a descriptor never allows or approves a hook."

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Link as a library without exporting the program entrypoint symbol.
no-entrypoint = []

[dependencies]
hook-kit = { path = "../../crates/hook-kit" }
solana-program = "=2.2.1"

[dev-dependencies]
solana-program-test = "=2.2.7"
solana-sdk = "=2.2.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
