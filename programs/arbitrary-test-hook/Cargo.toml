[package]
name = "arbitrary-test-hook"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "A deliberately unrelated third-party-style Transfer Hook used to prove the framework is permissionless"

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Link this crate as a library without exporting the program entrypoint symbol.
no-entrypoint = []

[dependencies]
solana-program = "=2.2.1"
spl-tlv-account-resolution = "=0.10.0"
spl-transfer-hook-interface = "=0.10.0"
spl-token-2022 = { version = "=7.0.0", features = ["no-entrypoint"] }

[dev-dependencies]
solana-program-test = "=2.2.7"
solana-sdk = "=2.2.2"
spl-token = "=7.0.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The SDK is a dev-dependency only: this hook must not depend on the reference hook or on
# any Raydium crate, and the SDK must work with it unchanged.
transfer-hook-sdk = { path = "../../crates/transfer-hook-sdk" }
