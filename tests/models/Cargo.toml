[package]
name = "model-checks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
clmm-hook-integration = { path = "../../integrations/clmm" }
cpmm-hook-integration = { path = "../../integrations/cpmm" }
hook-policy-model = { path = "../../crates/hook-policy-model" }
launchlab-hook-integration = { path = "../../integrations/launchlab", features = ["model"] }
reference-hook-model = { path = "../../crates/reference-hook-model" }
transfer-hook-sdk = { path = "../../crates/transfer-hook-sdk" }

[dev-dependencies]
transfer-hook-sdk = { path = "../../crates/transfer-hook-sdk", features = ["test-utils"] }
