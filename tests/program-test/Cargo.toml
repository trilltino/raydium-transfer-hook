[package]
name = "program-test-flows"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The Raydium + Transfer Hook end-to-end flows, run in-process against the real SBF programs"

# `src/lib.rs` is the shared scaffolding; the tests are `tests/local_flows.rs` (every hook through
# both AMMs) and the third-party acceptance tests in `tests/third-party-hook`.

[dependencies]
raydium-hook-driver = { path = "../../crates/raydium-hook-driver", features = ["local"] }
solana-program-test = "=2.2.7"
solana-sdk = "=2.2.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
