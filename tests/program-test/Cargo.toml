[package]
name = "program-test-flows"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The Raydium + Transfer Hook end-to-end flows, run in-process against the real SBF programs"

# `src/lib.rs` is the shared scaffolding; the tests are `tests/local_flows.rs` (every hook through
# both AMMs) and the third-party acceptance tests in `tests/third-party-hook`.

[dependencies]
raydium-hook-driver = { path = "../../crates/raydium-hook-driver", features = ["local"] }
solana-program-test = "=2.2.7"
solana-sdk = "=2.2.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
# The runtime tests drive a hooked swap through the real Raydium binaries with the starter as the hook
# (it is the repository's reference hook: a per-transfer maximum).
transfer-hook-starter = { path = "../../templates/transfer-hook-starter", features = ["no-entrypoint"] }
transfer-hook-sdk = { path = "../../crates/transfer-hook-sdk" }
solana-program = "=2.2.1"
spl-token-2022 = { version = "=7.0.0", features = ["no-entrypoint"] }
spl-token = { version = "=7.0.0", features = ["no-entrypoint"] }
spl-transfer-hook-interface = "=0.10.0"
