[package]
name = "third-party-hook-acceptance"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Proves the stack runs a hook it knows only by program id and a JSON description"

# Deliberately has NO dependency on any hook crate. The hook under test is a compiled .so and a
# JSON description of its setup, which is all a third party's hook is to this stack.

[dependencies]
program-test-flows = { path = "../program-test" }
raydium-hook-driver = { path = "../../crates/raydium-hook-driver", features = ["local"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
