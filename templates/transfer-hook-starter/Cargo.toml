[package]
name = "transfer-hook-starter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"
publish = false
description = "Copy me: a deployable Token-2022 Transfer Hook with the plumbing done; edit src/rule.rs"

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Link this crate as a library without exporting the program entrypoint symbol.
no-entrypoint = []

[dependencies]
solana-program = "=2.2.1"
spl-tlv-account-resolution = "=0.10.0"
spl-transfer-hook-interface = "=0.10.0"
spl-token = "=7.0.0"
spl-token-2022 = { version = "=7.0.0", features = ["no-entrypoint"] }

[dev-dependencies]
solana-program-test = "=2.2.7"
solana-sdk = "=2.2.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# An empty [workspace] table makes this a standalone project, so it still builds after you
# copy it out of this repository.
[workspace]
