[package]
name = "creator-commitment-hook"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Transfer Hook template: a creator allocation that vests, enforced on outgoing transfers"

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Link as a library without exporting the program entrypoint symbol.
no-entrypoint = []

[dependencies]
hook-kit = { path = "../../crates/hook-kit" }
solana-program = "=2.2.1"
spl-tlv-account-resolution = "=0.10.0"
spl-token-2022 = { version = "=7.0.0", features = ["no-entrypoint"] }

[dev-dependencies]
hook-kit = { path = "../../crates/hook-kit", features = ["test-support"] }
solana-program-test = "=2.2.7"
solana-sdk = "=2.2.2"
spl-transfer-hook-interface = "=0.10.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
