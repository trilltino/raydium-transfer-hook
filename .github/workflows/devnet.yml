# Manual: deploy the integration stack to Solana devnet and record evidence. Never runs on a normal
# push or pull request. Needs the integration keys as repository secrets (see docs/devnet.md); the
# integration builds of the forks bake in the admin and fee-receiver public keys, so these must be
# the keys those builds were made with.
name: Devnet integration

on:
  workflow_dispatch:
    inputs:
      hook:
        description: "Hook to run (all, reference, arbitrary, creator-commitment, fair-launch, fair-launch-per-slot, holder-rewards, holder-rewards-one-time)"
        default: all
      amm:
        description: "cpmm, clmm or all"
        default: all

env:
  CARGO_TERM_COLOR: always
  AGAVE_VERSION: v4.0.0

jobs:
  devnet:
    runs-on: ubuntu-latest
    environment: devnet
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install the Solana toolchain
        run: |
          mkdir -p ~/solana
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" \
            | tar xj -C ~/solana
          echo "$HOME/solana/solana-release/bin" >> "$GITHUB_PATH"
      - name: write keys
        env:
          KEYS_JSON: ${{ secrets.INTEGRATION_KEYS_JSON }}
        run: |
          # INTEGRATION_KEYS_JSON: {"deployer": [..64 bytes..], "cpmm-fee-receiver": [...], "cpmm-program": [...], ...}
          mkdir -p .keys
          python3 - <<'PY'
          import json, os
          for name, key in json.loads(os.environ["KEYS_JSON"]).items():
              with open(f".keys/{name}.json", "w") as f:
                  json.dump(key, f)
          PY
      - name: deploy, run and record
        run: cargo xtask env deploy-devnet --hook "${{ inputs.hook }}" --amm "${{ inputs.amm }}"
      - name: upload the updated manifest and evidence page
        uses: actions/upload-artifact@v4
        with:
          name: devnet-evidence
          path: |
            environments/devnet.json
            docs/devnet.md
