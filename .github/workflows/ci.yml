# CI from a clean checkout: no secrets, no public cluster. Dependencies are locked (--locked);
# the Rust toolchain is the moving `stable` (plus an MSRV check) and the Solana toolchain is the
# pinned Agave release below, downloaded at run time.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Test binaries that link the Solana runtime are huge with debug info.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  AGAVE_VERSION: v4.0.0

jobs:
  check:
    name: fmt, clippy, tests (hook-kit, templates, starter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            starter
      - name: cargo fmt
        run: |
          cargo fmt --all -- --check
          (cd starter && cargo fmt -- --check)
      - name: cargo clippy
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          (cd starter && cargo clippy --locked --all-targets -- -D warnings)
      - name: tests (hook-kit, every template, the starter), in-process against real Token-2022
        run: cargo test --locked --workspace && (cd starter && cargo test --locked)
      - name: deploy script syntax
        run: bash -n scripts/deploy.sh

  msrv:
    name: minimum supported Rust (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            starter
      - name: cargo check at the declared MSRV
        run: |
          cargo check --locked --workspace --all-targets
          (cd starter && cargo check --locked --all-targets)

  sbf:
    name: SBF build and tests against the compiled programs
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cache the Solana toolchain and platform tools
        uses: actions/cache@v4
        with:
          path: |
            ~/solana
            ~/.cache/solana
          key: agave-${{ env.AGAVE_VERSION }}
      - name: install the Solana toolchain
        run: |
          if [ ! -x ~/solana/solana-release/bin/cargo-build-sbf ]; then
            mkdir -p ~/solana
            curl -sSfL "https://github.com/anza-xyz/agave/releases/download/${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" \
              | tar xj -C ~/solana
          fi
          echo "$HOME/solana/solana-release/bin" >> "$GITHUB_PATH"
      - name: build every hook for SBF and run its tests against the real binary
        run: |
          for dir in templates/fair-launch templates/creator-commitment templates/holder-rewards starter; do
            cargo build-sbf --manifest-path "$dir/Cargo.toml" --sbf-out-dir "$PWD/$dir/target/deploy"
            # ProgramTest prefers a .so found in SBF_OUT_DIR over the native program.
            (cd "$dir" && SBF_OUT_DIR="$PWD/target/deploy" cargo test --locked)
          done
      - name: git status is clean (nothing generated is tracked)
        run: test -z "$(git status --porcelain)"
