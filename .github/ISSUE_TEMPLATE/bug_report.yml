name: Bug report
description: Something in the starter, hook-kit, a template or the deploy script does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Do not file it here. Report it privately: see SECURITY.md.
        This is an independent community project, not affiliated with Raydium, and not audited.
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - starter
        - hook-kit
        - templates/fair-launch
        - templates/creator-commitment
        - templates/holder-rewards
        - scripts/deploy.sh
        - docs
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Quote the README section (RULES, LIMITATIONS, TRUST, ...) that says otherwise, if any.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: A failing test is ideal. Otherwise the commands you ran and their output.
      render: text
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Where did you observe it?
      options:
        - cargo test (in-process)
        - SBF build (SBF_OUT_DIR=... cargo test)
        - local validator
        - devnet
        - other
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or tag
      placeholder: e.g. v0.1.0 or a commit hash
