[package]
name = "raydium-adapters"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Instruction builders for the external Raydium CPMM and CLMM programs, and for assembling hooked swaps"

[dependencies]
solana-program = "=2.2.1"
solana-sdk = "=2.2.2"
spl-token = "=7.0.0"
spl-token-2022 = { version = "=7.0.0", features = ["no-entrypoint"] }
transfer-hook-sdk = { path = "../transfer-hook-sdk" }
