[package]
name = "raydium-hook-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "raydium-hook: deploy, inspect and run hooked Raydium swaps end to end"

[[bin]]
name = "raydium-hook"
path = "src/main.rs"

[dependencies]
raydium-hook-driver = { path = "../raydium-hook-driver" }
transfer-hook-sdk = { path = "../transfer-hook-sdk" }
solana-sdk = "=2.2.2"
spl-token-2022 = { version = "=7.0.0", features = ["no-entrypoint"] }
spl-transfer-hook-interface = "=0.10.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
sha2 = "0.10"
